services:
  - type: web
    name: campusclear-backend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/public/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_JWT_EXPIRATION_MS
        value: "86400000"
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://rkvalley.vercel.app"
      - key: DB_HOST
        fromDatabase:
          name: innovx-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: innovx-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: innovx-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: innovx-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: innovx-postgres
          property: password

databases:
  - name: innovx-postgres
    region: singapore
    plan: free
    databaseName: nodues_db
