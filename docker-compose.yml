version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nodues-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nodues_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nodues_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nodues-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nodues-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: nodues_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      APP_JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:80,http://localhost"
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - nodues-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nodues-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - nodues-network

networks:
  nodues-network:
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:
