server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: automated-nodues-backend
  # Profiles are selected by the deployment/runtime environment.
  # Local development: -Dspring-boot.run.profiles=dev
  # Production: SPRING_PROFILES_ACTIVE=prod
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    # Never commit a production JWT secret. The dev profile supplies a local-only fallback.
    secret: ${APP_JWT_SECRET}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  storage:
    certificates-dir: ${CERTIFICATES_DIR:./uploads/certificates}
  sla:
    default-hours: ${APP_SLA_DEFAULT_HOURS:48}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
